{% load tailwind_cli %}
<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exoplanets | Dashboard</title>
    {% tailwind_css %}
</head>
<body class="bg-base-300 text-base-content min-h-screen">

    <!-- Навигация -->
    <nav class="navbar bg-base-100 shadow-lg px-6">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl font-bold text-primary">EXOPLANETS</a>
        </div>
        <div class="flex-none">
            <button class="btn btn-circle btn-ghost">
                <div class="avatar placeholder">
                    <div class="bg-neutral text-neutral-content rounded-full w-8">
                        <span>A</span>
                    </div>
                </div>
            </button>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Левая часть: Планета -->
        <div class="lg:col-span-2 bg-base-100 rounded-3xl shadow-xl flex flex-col items-center justify-center p-10 min-h-[500px]">
            <!-- Пока просто CSS-круг, потом заменишь на Three.js -->
            <div class="w-64 h-64 rounded-full bg-gradient-to-tr from-blue-900 to-blue-500 shadow-[0_0_60px_rgba(59,130,246,0.6)] animate-pulse"></div>
            
            <h1 class="text-4xl font-bold mt-8">Kepler-186 f</h1>
            <p class="text-base-content/70 mt-2">Первая планета земного размера в зоне обитаемости</p>
        </div>

        <!-- Правая часть: Карточки данных -->
        <div class="flex flex-col gap-4">
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body p-4">
                    <span class="text-sm text-base-content/60">Индекс подобия Земле (ESI)</span>
                    <span class="text-3xl font-bold text-primary">0.88</span>
                </div>
            </div>
            
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body p-4">
                    <span class="text-sm text-base-content/60">Радиус (Земля = 1)</span>
                    <span class="text-3xl font-bold text-secondary">1.17</span>
                </div>
            </div>

            <div class="card bg-base-100 shadow-xl">
                <div class="card-body p-4">
                    <span class="text-sm text-base-content/60">Температура</span>
                    <span class="text-3xl font-bold text-accent">254 K</span>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
